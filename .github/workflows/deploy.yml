name: Deploy API

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations'
        type: boolean
        default: true

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  SSH_HOST: 185.245.180.16
  SSH_USER: safa5451
  SSH_PORT: '65002'
  APP_DIR: /home/safa5451/api.safa-sponge.com
  RUN_MIGRATIONS: ${{ inputs.run_migrations }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret CPANEL_SSH_KEY is missing or empty."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          for attempt in 1 2 3 4 5; do
            echo "Connection attempt $attempt to $SSH_HOST:$SSH_PORT ..."
            if ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
                   -o StrictHostKeyChecking=accept-new \
                   -o BatchMode=yes -o ConnectTimeout=20 \
                   "$SSH_USER@$SSH_HOST" 'echo connection-ok'; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Attempt $attempt failed, waiting 45s before retrying ..."
              sleep 45
            fi
          done

          echo "::error::Cannot reach the server after 5 attempts. A network timeout means the host firewall is throttling or blocking GitHub runner IPs; 'Permission denied' means the deploy key is not authorized in cPanel."
          exit 1

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' RUN_MIGRATIONS='$RUN_MIGRATIONS' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$APP_DIR"

          php artisan down --retry=15 || true
          trap 'php artisan up || true' EXIT

          git fetch origin
          git reset --hard origin/main

          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

          if [ "$RUN_MIGRATIONS" = "true" ]; then
            php artisan migrate --force
          fi

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          php artisan --version
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
